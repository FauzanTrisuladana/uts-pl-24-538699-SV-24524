services:
  db:
    image: docker.io/library/mysql:9.7.1
    container_name: uts-kepl-mysql
    restart: always
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: ${MYSQL_ALLOW_EMPTY_PASSWORD:-yes}
      MYSQL_DATABASE: ${DB_DATABASE:-uts-kepl}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-}
    volumes:
      - kepl_mysql_data:/var/lib/mysql:Z
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    networks:
      - kepl
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  phpmyadmin:
    image: docker.io/phpmyadmin:5.2
    container_name: uts-kepl-phpmyadmin
    restart: always
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    ports:
      - "${PMA_HOST_PORT:-8081}:80"
    depends_on:
      - db
    networks:
      - kepl
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: uts-kepl-backend
    restart: always
    ports:
      - "${BACKEND_HOST_PORT:-8000}:80"
    environment:
      APP_NAME: ${APP_NAME:-Laravel}
      APP_ENV: ${APP_ENV:-local}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:8000}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-uts-kepl}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-}
      SESSION_DRIVER: database
      LOG_CHANNEL: ${LOG_CHANNEL:-stdout}
      LOG_STACK: ${LOG_STACK:-stdout}
      CACHE_STORE: ${CACHE_STORE:-file}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - kepl
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: uts-kepl-frontend
    restart: always
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:80"
    depends_on:
      - backend
    networks:
      - kepl
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  prometheus:
    image: docker.io/prom/prometheus:v2.55.1
    container_name: uts-kepl-prometheus
    restart: always
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
    ports:
      - "${PROMETHEUS_HOST_PORT:-9090}:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro,Z
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro,Z
      - kepl_prometheus_data:/prometheus:Z
    depends_on:
      - backend
      - cadvisor
      - node-exporter
    networks:
      - kepl
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  grafana:
    image: docker.io/grafana/grafana:11.5.2
    container_name: uts-kepl-grafana
    restart: always
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-KeplGrafana2026!}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "${GRAFANA_HOST_PORT:-3002}:3000"
    volumes:
      - kepl_grafana_data:/var/lib/grafana:Z
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro,Z
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro,Z
    depends_on:
      - prometheus
    networks:
      - kepl
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: uts-kepl-cadvisor
    restart: always
    privileged: true
    command:
      - "--port=8080"
      - "--docker_only=false"
      - "--store_container_labels=false"
    ports:
      - "${CADVISOR_HOST_PORT:-8085}:8080"
    volumes:
      - /:/rootfs:ro
      - /sys:/sys:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
    networks:
      - kepl
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  node-exporter:
    image: docker.io/prom/node-exporter:v1.9.0
    container_name: uts-kepl-node-exporter
    restart: always
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    ports:
      - "${NODE_EXPORTER_HOST_PORT:-9100}:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - kepl
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  kepl:
    name: kepl

volumes:
  kepl_mysql_data:
    name: kepl_mysql_data
  kepl_prometheus_data:
    name: kepl_prometheus_data
  kepl_grafana_data:
    name: kepl_grafana_data
